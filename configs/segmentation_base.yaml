# Shared settings for the LandCover.ai segmentation experiments.
# NOT built with `extends: base.yaml` -- several of that file's fields
# (feature_width, image_size, split) are classification-specific and would
# be misleading here; this file is self-contained instead.

task: segmentation
arm: classical  # classical | quantum | control

dataset: landcover
# data_dir: the Kaggle-attached LandCover.ai dataset root (read-only), the
# one containing images/, masks/, split.py, train.txt/val.txt/test.txt as
# siblings. EDIT THIS to match your actual mount path -- run `!ls
# /kaggle/input/` after attaching the dataset to find it; it may be
# `/kaggle/input/landcoverai` or nested under `/kaggle/input/datasets/...`
# depending on which Kaggle environment you're on (we've seen both).
data_dir: /kaggle/input/landcoverai
tiles_dir: data/landcover_tiles   # writable tiling cache -- NOT the read-only input
# 64 (not 128): the quantum-bottleneck smoke test at 128/n_qubits=6,n_layers=3
# took 1890s (31.5 min) for ONE epoch -- over CLAUDE.md's 30-min smoke-test
# ceiling. Quantum cost scales with (bottleneck spatial locations) x
# (per-circuit cost); halving tile_size quarters the locations (4x4=16 ->
# 2x2=4, still divisible by the encoder's 32x downsampling).
tile_size: 64
cache_dir: data/cache             # HSI+Edge preprocessing cache

epochs: 30
batch_size: 8   # 64x64x4 U-Net is still heavier per-sample than 64x64 classification
optimizer: adam
lr: 1.0e-3

early_stopping:
  monitor: val_loss
  patience: 5

seeds: [0, 1, 2]   # brief calls for >=3 seeds minimum for this phase

# 4,2 (not 6,3): the other half of cutting the smoke test's 1890s/epoch --
# fewer qubits shrinks the state vector (2^4=16 vs 2^6=64) and fewer layers
# cuts gate count, on top of tile_size's 4x fewer locations. Budget is now
# 24 params (4*2*3) instead of 54, still a real point on the classification
# sweep's own budget scale.
n_qubits: 4
n_layers: 2
entangle: true
data_reuploading: false

results_csv: results/results_segmentation.csv
checkpoint_dir: results/checkpoints_segmentation
